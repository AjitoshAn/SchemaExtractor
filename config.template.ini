[DEFAULT]
user = your_username
source_name = schema_exporter
business_domain = Controlling
business_owner = your_name

[Database]
auth_method = service_principal
client_id = your_client_id_here
tenant_id = your_tenant_id_here
client_secret = your_client_secret_here

[Domain.Controlling]
sql_server = your_sql_server_url_here
sharepoint_path = C:\Users\your_username\Your Company\Data Mesh - Data Model\001 Controlling
sharepoint_site_url = https://yourcompany.sharepoint.com/sites/DataMesh
sharepoint_doc_library_path = Freigegebene%20Dokumente
db_prefix       = CNT_
; db_override = CNT_

[Domain.SCM]
sql_server = your_sql_server_url_here
sharepoint_path = C:\Users\your_username\Your Company\Data Mesh - Data Model\002 Supply Chain Management
sharepoint_site_url = https://yourcompany.sharepoint.com/sites/DataMesh
sharepoint_doc_library_path = Freigegebene%20Dokumente
db_prefix       = SCM_GOLD_API
; db_override = SCM_GOLD_API

# ====================================
[Flow.Controlling]
# Use the HTTP Trigger URL from Power Automate
notification_trigger_url = your_notification_trigger_url_here

[Flow.SCM]
notification_trigger_url = your_notification_trigger_url_here 